name: Build Images and Update Argo GitOps

on:
  push:
    branches:
      - feat/upgrade-application
    paths:
      - "api/**"
      - "frontend/**"
      - ".github/workflows/gitops-deploy.yml"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/upgrade-application
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image names
        run: |
          echo "API_IMAGE=$(echo '${{ env.API_IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=$(echo '${{ env.FRONTEND_IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_TAG=sha-${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.API_IMAGE }}:dev
      
      - name: Generate frontend version file
        run: |
          cat > frontend/version.js <<EOF
          window.APP_VERSION = {
            version: "v2.0.${GITHUB_RUN_NUMBER}",
            commit: "${GITHUB_SHA::7}",
            buildTime: "$(date -u '+%Y-%m-%d %H:%M UTC')"
          };
          EOF

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:dev

      - name: Update Kind Helm values
        run: |
          cat > helm/mlops-training/envs/kind-values.yaml <<EOF
          global:
            imagePullPolicy: Always
            imagePullSecrets:
              - ghcr-secret

          api:
            image:
              repository: ghcr.io/amine12344/mlops-training-01/api
              tag: ${IMAGE_TAG}

          frontend:
            image:
              repository: ghcr.io/amine12344/mlops-training-01/frontend
              tag: ${IMAGE_TAG}
          EOF

      - name: Commit GitOps image update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/mlops-training/envs/kind-values.yaml

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(gitops): deploy ${IMAGE_TAG}"
            git push origin feat/upgrade-application
          fi