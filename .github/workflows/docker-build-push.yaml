name: Build Docker Image
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate API Docker build
        run: docker build -t training-api -f Dockerfile.vmultistage .
  
  image-security-scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Build image locally
        run: |
          docker build -t training-api:${{ github.sha }} -f Dockerfile.vmultistage .

      - name: Scan image - fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: training-api:${{ github.sha }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: 0
      
      - name: Generate SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: training-api:${{ github.sha }}
          vuln-type: os,library
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
      
      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif


  build-and-push:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            image: ghcr.io/${{ github.repository_owner }}/api-training

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: Dockerfile.vmultistage
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}