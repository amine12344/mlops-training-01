{{- if .Values.smokeTests.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: mlops-training-smoke-test
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: {{ .Values.smokeTests.image }}
          command:
            - sh
            - -c
            - |
              set -e

              echo "Smoke test started"

              echo "Checking frontend service..."
              curl -fsS http://frontend/

              echo "Checking API root..."
              curl -fsS http://api:8090/

              echo "Checking API health..."
              curl -fsS http://api:8090/health

              echo "Checking API readiness..."
              curl -fsS http://api:8090/readyz

              echo "Checking API database..."
              curl -fsS http://api:8090/db

              echo "Checking API metrics..."
              curl -fsS http://api:8090/metrics | grep mlops_http_requests_total

              echo "Smoke test passed"
{{- end }}